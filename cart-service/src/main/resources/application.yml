server:
  port: 8082

spring:
  application:
    name: cart-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # Used only by the write-behind consumer (package writebehind.store); no request path touches it.
  # The pool connects lazily, so Postgres being down never stops the service from starting.
  datasource:
    url: ${CART_DB_URL:jdbc:postgresql://localhost:5432/cart}
    username: ${CART_DB_USER:cart}
    password: ${CART_DB_PASSWORD:cart}
    hikari:
      maximum-pool-size: 2
      minimum-idle: 0
      connection-timeout: 3000

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        # The send runs on its own thread; a stopped broker only delays that thread.
        max.block.ms: 2000
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
    consumer:
      group-id: cart-service
      # Events only matter from now on: a missed one is covered by the 60 s TTL.
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

management:
  # Prometheus is served on the internal management port only; the app port exposes health and info
  # (see management.AppPortActuatorConfiguration).
  server:
    port: ${MANAGEMENT_PORT:9082}
  metrics:
    distribution:
      percentiles-histogram:
        cart.product_lookup: true
  health:
    # Neither Postgres nor the broker takes the service out of rotation.
    db:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

auth:
  jwt:
    issuer: ${AUTH_JWT_ISSUER:mayshop-core}
    audience: ${AUTH_JWT_AUDIENCE:mayshop}
    jwks-uri: ${CORE_URL:http://localhost:8081}/.well-known/jwks.json
    jwks-connect-timeout: 1s
    jwks-read-timeout: 2s

product:
  lookup:
    core-url: ${CORE_URL:http://localhost:8081}
    internal-token: ${INTERNAL_API_TOKEN:}
    timeout: ${PRODUCT_LOOKUP_TIMEOUT:150ms}
    cache-ttl: 60s
    # How long a cached product may still be served when core fails, times out or the breaker is open.
    stale-ttl: ${PRODUCT_LOOKUP_STALE_TTL:10m}

# Breaker for the product lookup against core. A call is slow when it lasts as long as the lookup
# timeout. The time limiter is disabled: the HTTP client's timeout is the only time bound.
resilience4j:
  circuitbreaker:
    instances:
      product-lookup:
        sliding-window-type: COUNT_BASED
        sliding-window-size: ${PRODUCT_LOOKUP_BREAKER_WINDOW:20}
        minimum-number-of-calls: ${PRODUCT_LOOKUP_BREAKER_MIN_CALLS:10}
        failure-rate-threshold: ${PRODUCT_LOOKUP_BREAKER_FAILURE_RATE:50}
        slow-call-rate-threshold: ${PRODUCT_LOOKUP_BREAKER_SLOW_RATE:50}
        slow-call-duration-threshold: ${PRODUCT_LOOKUP_TIMEOUT:150ms}
        wait-duration-in-open-state: ${PRODUCT_LOOKUP_BREAKER_OPEN_SECONDS:10}s
        permitted-number-of-calls-in-half-open-state: ${PRODUCT_LOOKUP_BREAKER_HALF_OPEN_CALLS:5}
        automatic-transition-from-open-to-half-open-enabled: true

spring.cloud.circuitbreaker.resilience4j:
  disable-time-limiter: true

cart:
  snapshot-cleanup:
    cron: ${CART_SNAPSHOT_CLEANUP_CRON:0 30 3 * * *}
  # Reads the running flash sale from core on start-up and every interval, so its SKUs are cached.
  warmup:
    enabled: ${CART_WARMUP_ENABLED:true}
    interval: ${CART_WARMUP_INTERVAL:60s}
    timeout: ${CART_WARMUP_TIMEOUT:2s}
  placeholder-image-url: ${CART_PLACEHOLDER_IMAGE_URL:http://localhost:3000/images/cart-placeholder.svg}
