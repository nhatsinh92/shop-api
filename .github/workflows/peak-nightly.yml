# Nightly peak run: `make demo-peak` (k6 against the demo stack with a toxiproxy phase).
# A missed threshold opens an issue (or comments on the open one); it never fails a PR.
name: peak-nightly

on:
  schedule:
    # 18:00 UTC = 01:00 in Asia/Ho_Chi_Minh (UTC+7, no daylight saving).
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: peak-nightly
  cancel-in-progress: false

jobs:
  peak:
    name: peak
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ISSUE_TITLE: "Nightly peak run failed a threshold"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the peak scenario
        id: peak
        continue-on-error: true
        run: make demo-peak
      - name: Upload the k6 summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: k6-peak-summary
          path: build/k6/peak-summary.json
          if-no-files-found: warn
      - name: Open or update the regression issue
        if: steps.peak.outcome == 'failure'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          {
            echo "The nightly \`make demo-peak\` run failed."
            echo
            echo "- Run: ${RUN_URL}"
            echo "- Commit: \`${SHA}\`"
            echo "- The k6 summary is attached to the run as the \`k6-peak-summary\` artifact."
            echo
            if [ -f build/k6/peak-summary.json ]; then
              echo "### Thresholds"
              echo
              echo "| Metric | Threshold | Result |"
              echo "| --- | --- | --- |"
              jq -r '.metrics | to_entries[] | select(.value.thresholds != null)
                | .key as $m | .value.thresholds | to_entries[]
                | "| \($m) | \(.key) | \(if .value.ok == false or .value == true then "FAILED" else "ok" end) |"' \
                build/k6/peak-summary.json
            else
              echo "No k6 summary was produced: the stack or k6 failed before the run finished. See the job log."
            fi
          } > body.md
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label area:infra \
            --search "\"$ISSUE_TITLE\" in:title" --json number,title \
            --jq "map(select(.title == \"$ISSUE_TITLE\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file body.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" \
              --label bug --label area:infra --body-file body.md
          fi
      - name: Logs on failure
        if: steps.peak.outcome == 'failure'
        run: docker compose -f infra/docker-compose.yml -f infra/docker-compose.peak.yml --profile peak logs --no-color --tail=100
      - name: Stop
        if: always()
        run: make demo-down
