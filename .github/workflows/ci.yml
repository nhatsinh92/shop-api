# CI for every PR and for main. Never calls a model; uses only GITHUB_TOKEN (read-only here).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Lint, compile, tests (Testcontainers), Modulith and ArchUnit
        run: make lint-java test build
      - name: No skipped tests in CI
        # Testcontainers tests skip themselves where Docker is missing (Claude Code cloud sessions);
        # CI has Docker, so every test must run here.
        run: |
          skipped=$(grep -ho 'skipped="[0-9]*"' ./*/build/test-results/test/*.xml | grep -v 'skipped="0"' || true)
          if [[ -n $skipped ]]; then
            grep -l 'skipped="[1-9]' ./*/build/test-results/test/*.xml
            echo "::error::Tests were skipped in CI; Docker is available here, so every test must run."
            exit 1
          fi
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: "*/build/reports/"
          retention-days: 7

  contract-lint:
    name: contract-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: make lint-contract

  scripts:
    name: scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ShellCheck
        run: >-
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0 -x -S warning
          scripts/*.sh scripts/lib/*.sh scripts/tests/*.sh .github/scripts/pr-policy.sh
      - name: Picker tests
        run: make test-scripts

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan the full git history for secrets
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git --redact --verbose /repo

  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan lockfiles (gradle.lockfile) against OSV
        run: docker run --rm -v "$PWD:/src:ro" ghcr.io/google/osv-scanner:v2.7.1 scan source -r /src
