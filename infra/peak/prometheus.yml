# Scrapes the internal management ports over the compose network (never published on the host).
global:
  scrape_interval: 5s
scrape_configs:
  - job_name: gateway
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["gateway:9080"] }]
  - job_name: core
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["core:9081"] }]
  - job_name: cart-service
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["cart-service:9082"] }]
