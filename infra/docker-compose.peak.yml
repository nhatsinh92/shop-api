# Overlay for `make demo-peak`: the gateway reaches cart-service through toxiproxy so latency
# and faults can be injected (toxiproxy API on :8474; shop-web's server uses :18083). Used together
# with docker-compose.yml. Peak rate limits let k6 from one IP through; per-user checkout limits
# (GATEWAY_CHECKOUT_RESERVATION_RATE, GATEWAY_ORDER_RATE) stay at their defaults.
services:
  gateway:
    environment:
      CART_SERVICE_URL: http://toxiproxy:18082
      GATEWAY_CORE_RATE: "5000"
      GATEWAY_CORE_BURST: "10000"
      GATEWAY_LOGIN_PER_IP_PER_MINUTE: "100000"
    depends_on:
      toxiproxy: { condition: service_started }

  # k6 reaches toxiproxy (toxic API) and Prometheus (gateway_fallback_total) over the compose
  # network; the summary lands in build/k6/ on the host (see `make demo-peak`).
  k6:
    environment:
      TOXIPROXY_URL: http://toxiproxy:8474
      PROMETHEUS_URL: http://prometheus:9090
      LOAD_PASSWORD: ${LOAD_PASSWORD:-load-test-2026}
      # Optional load overrides (the nightly workflow lowers them); empty keeps peak.js's 50 / 50 / 20.
      BROWSE_VUS: ${BROWSE_VUS:-}
      CART_VUS: ${CART_VUS:-}
      CHECKOUT_VUS: ${CHECKOUT_VUS:-}
    volumes: ["../build/k6:/results"]
    depends_on:
      toxiproxy: { condition: service_started }
      prometheus: { condition: service_started }
