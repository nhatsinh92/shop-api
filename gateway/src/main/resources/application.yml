server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # Order matters: the cart route must come before the catch-all core route.
            - id: cart-service
              uri: ${CART_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/cart/**
            - id: core
              uri: ${CORE_URL:http://localhost:8081}
              predicates:
                - Path=/api/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
