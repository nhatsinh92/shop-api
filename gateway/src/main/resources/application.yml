server:
  port: 8080

spring:
  application:
    name: gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${GATEWAY_REDIS_TIMEOUT:200ms}
      connect-timeout: ${GATEWAY_REDIS_CONNECT_TIMEOUT:200ms}
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT:200}
          # Order matters: specific routes first, the catch-all core route last. No route configures
          # a Retry filter: a write must never be replayed by the edge. Breakers (the
          # Breaker filter, Spring Cloud Gateway's CircuitBreaker minus /api/auth/**) exist only on
          # cart-read, cart-write and core; order-write, reservation-write and /api/auth/** have none.
          routes:
            - id: cart-read
              uri: ${CART_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/cart/**
                - Method=GET,HEAD
              metadata:
                response-timeout: ${GATEWAY_CART_READ_TIMEOUT:300}
              filters:
                - name: Breaker
                  args:
                    name: cart-read
                    statusCodes: 500,502,503,504
            - id: cart-write
              uri: ${CART_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/cart/**
              metadata:
                response-timeout: ${GATEWAY_CART_WRITE_TIMEOUT:2000}
              filters:
                - name: Breaker
                  args:
                    name: cart-write
                    statusCodes: 500,502,503,504
            - id: order-write
              uri: ${CORE_URL:http://localhost:8081}
              predicates:
                - Path=/api/orders
                - Method=POST
              metadata:
                response-timeout: ${GATEWAY_ORDER_TIMEOUT:5000}
            - id: reservation-write
              uri: ${CORE_URL:http://localhost:8081}
              predicates:
                - Path=/api/checkout/reservations
                - Method=POST
              metadata:
                response-timeout: ${GATEWAY_RESERVATION_TIMEOUT:2000}
            - id: core
              uri: ${CORE_URL:http://localhost:8081}
              predicates:
                - Path=/api/**
              metadata:
                response-timeout: ${GATEWAY_CORE_TIMEOUT:1000}
              filters:
                - name: Breaker
                  args:
                    name: core
                    statusCodes: 500,502,503,504

gateway:
  auth:
    issuer: ${AUTH_JWT_ISSUER:mayshop-core}
    audience: ${AUTH_JWT_AUDIENCE:mayshop}
    # Fetched lazily on the first request that carries an access cookie, so the gateway starts while
    # core is down. Only /api/** is routed; /.well-known/** is never exposed.
    jwks-uri: ${CORE_URL:http://localhost:8081}/.well-known/jwks.json

  # The only origin allowed to make credentialed cross-origin calls and state-changing requests.
  web-origin: ${WEB_ORIGIN:http://localhost:3000}

  # Comma-separated CIDRs (IPv4 and IPv6) of proxies whose X-Forwarded-For is trusted; empty = none.
  client-ip:
    trusted-proxies: ${GATEWAY_TRUSTED_PROXIES:}

  rate-limit:
    login-per-email-per-minute: ${GATEWAY_LOGIN_PER_EMAIL_PER_MINUTE:5}
    login-per-ip-per-minute: ${GATEWAY_LOGIN_PER_IP_PER_MINUTE:60}
    refresh-per-session-per-minute: ${GATEWAY_REFRESH_PER_SESSION_PER_MINUTE:10}
    core-rate: ${GATEWAY_CORE_RATE:20}
    core-burst: ${GATEWAY_CORE_BURST:40}
    checkout-reservation-rate: ${GATEWAY_CHECKOUT_RESERVATION_RATE:10}
    order-rate: ${GATEWAY_ORDER_RATE:20}

# One breaker per upstream class. Every value is overridable by an environment variable; a call is
# slow when it lasts as long as the route's timeout. The time limiter is disabled below, so the
# route's response-timeout is the only time bound (a 1 s default limiter would cut cart writes).
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: ${GATEWAY_BREAKER_WINDOW:20}
        minimum-number-of-calls: ${GATEWAY_BREAKER_MIN_CALLS:10}
        failure-rate-threshold: ${GATEWAY_BREAKER_FAILURE_RATE:50}
        slow-call-rate-threshold: ${GATEWAY_BREAKER_SLOW_RATE:50}
        wait-duration-in-open-state: ${GATEWAY_BREAKER_OPEN_SECONDS:10}s
        permitted-number-of-calls-in-half-open-state: ${GATEWAY_BREAKER_HALF_OPEN_CALLS:5}
        automatic-transition-from-open-to-half-open-enabled: true
    instances:
      cart-read:
        base-config: default
        slow-call-duration-threshold: ${GATEWAY_CART_READ_TIMEOUT:300}ms
      cart-write:
        base-config: default
        slow-call-duration-threshold: ${GATEWAY_CART_WRITE_TIMEOUT:2000}ms
      core:
        base-config: default
        slow-call-duration-threshold: ${GATEWAY_CORE_TIMEOUT:1000}ms

spring.cloud.circuitbreaker.resilience4j:
  disable-time-limiter: true

# No bulkhead on the breaker routes. resilience4j-bulkhead is on the classpath, so Spring Cloud
# CircuitBreaker would otherwise wrap every breaker call in a 25-call semaphore bulkhead: a call over
# that limit answers 500 and counts as a breaker failure, opening the cart breakers while
# cart-service is healthy (#195). The gateway is reactive, so a waiting call holds no thread.
spring.cloud.circuitbreaker.bulkhead.resilience4j:
  enabled: ${GATEWAY_BREAKER_BULKHEAD_ENABLED:false}

management:
  # Prometheus is served on the internal management port only; the app port exposes health and info.
  server:
    port: ${MANAGEMENT_PORT:9080}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        spring.cloud.gateway.requests: true
        http.server.requests: true
  health:
    # Rate limits fail open, so a Redis outage must not take the gateway out of rotation.
    redis:
      enabled: false
  endpoint:
    health:
      probes:
        enabled: true
