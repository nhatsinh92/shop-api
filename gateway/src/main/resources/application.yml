server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # Order matters: the cart route must come before the catch-all core route.
            - id: cart-service
              uri: ${CART_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/cart/**
            - id: core
              uri: ${CORE_URL:http://localhost:8081}
              predicates:
                - Path=/api/**

gateway:
  auth:
    issuer: ${AUTH_JWT_ISSUER:mayshop-core}
    audience: ${AUTH_JWT_AUDIENCE:mayshop}
    # Fetched lazily on the first request that carries an access cookie, so the gateway starts while
    # core is down. Only /api/** is routed; /.well-known/** is never exposed.
    jwks-uri: ${CORE_URL:http://localhost:8081}/.well-known/jwks.json

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
