server:
  port: 8080

spring:
  application:
    name: gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${GATEWAY_REDIS_TIMEOUT:200ms}
      connect-timeout: ${GATEWAY_REDIS_CONNECT_TIMEOUT:200ms}
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT:200}
          # Order matters: specific routes first, the catch-all core route last. No route configures
          # a Retry filter: a write must never be replayed by the edge.
          routes:
            - id: cart-read
              uri: ${CART_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/cart/**
                - Method=GET,HEAD
              metadata:
                response-timeout: ${GATEWAY_CART_READ_TIMEOUT:300}
            - id: cart-write
              uri: ${CART_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/cart/**
              metadata:
                response-timeout: ${GATEWAY_CART_WRITE_TIMEOUT:2000}
            - id: order-write
              uri: ${CORE_URL:http://localhost:8081}
              predicates:
                - Path=/api/orders
                - Method=POST
              metadata:
                response-timeout: ${GATEWAY_ORDER_TIMEOUT:5000}
            - id: reservation-write
              uri: ${CORE_URL:http://localhost:8081}
              predicates:
                - Path=/api/checkout/reservations
                - Method=POST
              metadata:
                response-timeout: ${GATEWAY_RESERVATION_TIMEOUT:2000}
            - id: core
              uri: ${CORE_URL:http://localhost:8081}
              predicates:
                - Path=/api/**
              metadata:
                response-timeout: ${GATEWAY_CORE_TIMEOUT:1000}

gateway:
  auth:
    issuer: ${AUTH_JWT_ISSUER:mayshop-core}
    audience: ${AUTH_JWT_AUDIENCE:mayshop}
    # Fetched lazily on the first request that carries an access cookie, so the gateway starts while
    # core is down. Only /api/** is routed; /.well-known/** is never exposed.
    jwks-uri: ${CORE_URL:http://localhost:8081}/.well-known/jwks.json

  # The only origin allowed to make credentialed cross-origin calls and state-changing requests.
  web-origin: ${WEB_ORIGIN:http://localhost:3000}

  rate-limit:
    login-per-email-per-minute: ${GATEWAY_LOGIN_PER_EMAIL_PER_MINUTE:5}
    login-per-ip-per-minute: ${GATEWAY_LOGIN_PER_IP_PER_MINUTE:60}
    refresh-per-session-per-minute: ${GATEWAY_REFRESH_PER_SESSION_PER_MINUTE:10}
    core-rate: ${GATEWAY_CORE_RATE:20}
    core-burst: ${GATEWAY_CORE_BURST:40}
    checkout-reservation-rate: ${GATEWAY_CHECKOUT_RESERVATION_RATE:10}
    order-rate: ${GATEWAY_ORDER_RATE:20}

management:
  # Prometheus is served on the internal management port only; the app port exposes health and info.
  server:
    port: ${MANAGEMENT_PORT:9080}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        spring.cloud.gateway.requests: true
        http.server.requests: true
  health:
    # Rate limits fail open, so a Redis outage must not take the gateway out of rotation.
    redis:
      enabled: false
  endpoint:
    health:
      probes:
        enabled: true
