server:
  port: 8081

spring:
  application:
    name: core
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shop}
    username: ${DB_USER:shop}
    password: ${DB_PASSWORD:shop}
  flyway:
    # The auth module owns schema `auth`; its scripts live in db/migration/auth.
    locations: classpath:db/migration/auth
    schemas: auth
    default-schema: auth
    create-schemas: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Modulith's Kafka message converter turns the event into JSON bytes before the producer.
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      # Wait for the broker's acknowledgement; the registry resubmits what was not confirmed.
      acks: all
  modulith:
    events:
      jdbc:
        # The event publication registry lives in its own schema (db/migration/modulith).
        schema: modulith
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Fail fast: refresh must keep working when Redis is down.
      timeout: 500ms
      connect-timeout: 500ms

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    redis:
      # Redis only holds grace-period keys; core stays ready without it.
      enabled: false
  endpoint:
    health:
      probes:
        enabled: true

auth:
  jwt:
    # PKCS#8 RSA private key in PEM form. Blank: an ephemeral key is generated at startup.
    private-key: ${AUTH_JWT_PRIVATE_KEY:}
    # Optional public key (PEM) of the previous signing key, published during rotation.
    previous-public-key: ${AUTH_JWT_PREVIOUS_PUBLIC_KEY:}
    issuer: ${AUTH_JWT_ISSUER:mayshop-core}
    audience: ${AUTH_JWT_AUDIENCE:mayshop}
    access-token-ttl: ${AUTH_ACCESS_TOKEN_TTL:10m}
  session:
    refresh-token-ttl: ${AUTH_REFRESH_TOKEN_TTL:14d}
    # Window in which a just-rotated refresh token is still accepted (parallel tabs, SSR).
    refresh-grace: ${AUTH_REFRESH_GRACE:10s}

product:
  internal:
    # Shared secret of X-Internal-Token on /internal/**. Blank: the internal operations answer 404.
    api-token: ${INTERNAL_API_TOKEN:}
  # Stock up to and including this many units is reported as LOW.
  low-stock-threshold: ${PRODUCT_LOW_STOCK_THRESHOLD:50}
  # Shown as a card image for a product that has none.
  placeholder-image-url: ${PRODUCT_PLACEHOLDER_IMAGE_URL:https://placehold.co/800x800?text=no-image}
  revalidate:
    # shop-web's POST /hooks/revalidate. Blank: no revalidation webhook is sent.
    url: ${WEB_REVALIDATE_URL:}
    # Signs the webhook (HMAC-SHA256). Required when the URL is set.
    secret: ${REVALIDATE_SECRET:}
  member-price:
    # Discount in percent per member tier; the result is rounded down to a multiple of 500 VND.
    discounts:
      STANDARD: 0
      SILVER: 3
      GOLD: 5
      PLATINUM: 8

checkout:
  payment:
    # Comma-separated method ids (COD, EWALLET, CARD) shown as unavailable.
    disabled-methods: ${CHECKOUT_DISABLED_PAYMENT_METHODS:}
    # The mock payment gateway; connect timeout is fixed at 500 ms, the read timeout is configurable.
    url: ${PAYMENT_URL:http://localhost:8090}
    timeout: ${PAYMENT_TIMEOUT:3s}
    # Demo only: forward the X-Mock-Outcome header (fail | timeout) to the gateway.
    mock-outcome-header: ${PAYMENT_MOCK_OUTCOME_HEADER:false}
  sweep:
    # Gives the stock of expired reservations back; false turns the sweep off (tests).
    enabled: ${CHECKOUT_SWEEP_ENABLED:true}
    interval: ${CHECKOUT_SWEEP_INTERVAL:PT10S}

order:
  recovery:
    # Settles online orders whose payment never resolved; false turns the job off (tests).
    enabled: ${ORDER_RECOVERY_ENABLED:true}
    interval: ${ORDER_RECOVERY_INTERVAL:PT30S}

flags:
  # Used when Redis (hash `flags`) has no usable value or is down: comma-separated name=on|off,
  # for example `recommendations=off,member-price=on`. Flags not listed are on.
  defaults: ${FLAGS_DEFAULTS:}

# Breaker `payment` (checkout.Payments). Slow = the charge reached its timeout. The time limiter is
# disabled: Spring Cloud CircuitBreaker's default 1 s limiter would cut a charge before
# PAYMENT_TIMEOUT (3 s), so the HTTP client's read timeout is the only time bound.
resilience4j:
  circuitbreaker:
    instances:
      payment:
        sliding-window-type: COUNT_BASED
        sliding-window-size: ${PAYMENT_BREAKER_WINDOW:20}
        minimum-number-of-calls: ${PAYMENT_BREAKER_MIN_CALLS:10}
        failure-rate-threshold: ${PAYMENT_BREAKER_FAILURE_RATE:50}
        slow-call-rate-threshold: ${PAYMENT_BREAKER_SLOW_RATE:50}
        slow-call-duration-threshold: ${PAYMENT_TIMEOUT:3s}
        wait-duration-in-open-state: ${PAYMENT_BREAKER_OPEN_SECONDS:10}s
        permitted-number-of-calls-in-half-open-state: ${PAYMENT_BREAKER_HALF_OPEN_CALLS:5}
        automatic-transition-from-open-to-half-open-enabled: true

spring.cloud.circuitbreaker.resilience4j:
  disable-time-limiter: true
