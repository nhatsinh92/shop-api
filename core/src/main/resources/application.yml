server:
  port: 8081

spring:
  application:
    name: core
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shop}
    username: ${DB_USER:shop}
    password: ${DB_PASSWORD:shop}
  flyway:
    # The auth module owns schema `auth`; its scripts live in db/migration/auth.
    locations: classpath:db/migration/auth
    schemas: auth
    default-schema: auth
    create-schemas: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Fail fast: refresh must keep working when Redis is down.
      timeout: 500ms
      connect-timeout: 500ms

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    redis:
      # Redis only holds grace-period keys; core stays ready without it.
      enabled: false
  endpoint:
    health:
      probes:
        enabled: true

auth:
  jwt:
    # PKCS#8 RSA private key in PEM form. Blank: an ephemeral key is generated at startup.
    private-key: ${AUTH_JWT_PRIVATE_KEY:}
    # Optional public key (PEM) of the previous signing key, published during rotation.
    previous-public-key: ${AUTH_JWT_PREVIOUS_PUBLIC_KEY:}
    issuer: ${AUTH_JWT_ISSUER:mayshop-core}
    audience: ${AUTH_JWT_AUDIENCE:mayshop}
    access-token-ttl: ${AUTH_ACCESS_TOKEN_TTL:10m}
  session:
    refresh-token-ttl: ${AUTH_REFRESH_TOKEN_TTL:14d}
    # Window in which a just-rotated refresh token is still accepted (parallel tabs, SSR).
    refresh-grace: ${AUTH_REFRESH_GRACE:10s}
