openapi: 3.1.1
info:
  title: Shop core API
  version: 1.1.0
  description: >-
    Auth, product, order and checkout. Phase 1 pre-release: health, auth, the product catalog, the flash sale, member price, recommendations and the checkout reservation, shipping and payment options are specified so far, and order placement and lookup.
    The gateway answers 403 `AUTH_FORBIDDEN` when the `Origin` check fails on a state-changing request and 429 `RATE_LIMITED` when a rate limit is exceeded.
  license:
    name: UNLICENSED
    identifier: UNLICENSED
servers:
  - url: http://localhost:8081
    description: Local service (behind the gateway at http://localhost:8080 in the demo)
# Secure by default: cookieAuth (browser) or bearerAuth (gateway to service) as alternatives.
# Public operations such as health opt out with `security: []`.
security:
  - cookieAuth: []
  - bearerAuth: []
tags:
  - name: health
    description: Liveness and readiness.
  - name: auth
    description: >-
      Login, token refresh, logout, current user and the JWKS the gateway uses to verify access
      tokens. Tokens travel only in httpOnly cookies, never in a request or response body.
  - name: products
    description: >-
      Public product catalog: list, detail and a short-cache availability read. Responses carry
      `Cache-Control` and the `x-cache-tags` the frontend uses to revalidate. Also the member price
      and recommendations, which are user-aware and never cached by shared caches.
  - name: flash-sale
    description: The cached flash sale list shown on the home page.
  - name: checkout
    description: >-
      Stock reservation (10-minute hold), shipping options and payment methods for the checkout
      page. Every operation needs a signed-in user and answers with `Cache-Control: private, no-store`.
  - name: orders
    description: >-
      Place an order from an active checkout reservation, exactly once per `Idempotency-Key`, and
      read it back. Every operation needs a signed-in user and answers with
      `Cache-Control: private, no-store`.
paths:
  /actuator/health:
    get:
      operationId: coreHealth
      summary: Service health
      tags: [health]
      security: []
      responses:
        '200':
          description: The service is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              examples:
                up:
                  value:
                    status: UP
        '503':
          description: The service or one of its dependencies is down.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              examples:
                down:
                  value:
                    status: DOWN
        default:
          $ref: './errors.yaml#/components/responses/InternalError'
  /api/auth/login:
    post:
      operationId: login
      summary: Log in with email and password
      description: >-
        Verifies the credentials and starts a session. The response sets three cookies through
        `Set-Cookie`: `access_token` (httpOnly, Secure, SameSite=Lax, short lived, 5-15 minutes),
        `refresh_token` (httpOnly, Secure, SameSite=Lax, long lived) and the hint cookie
        `logged_in=1` (not httpOnly, so the browser can tell that a session exists). No token is
        ever returned in the response body.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              default:
                value:
                  email: linh.nguyen@example.com
                  password: correct-horse-battery-staple
      responses:
        '200':
          description: Logged in. The tokens are in the `Set-Cookie` headers.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookies'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
              examples:
                default:
                  value:
                    id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                    email: linh.nguyen@example.com
                    displayName: Linh Nguyen
                    memberTier: GOLD
        '400':
          $ref: './errors.yaml#/components/responses/BadRequest'
        '401':
          description: The email or password is wrong.
          content:
            application/problem+json:
              schema:
                $ref: './errors.yaml#/components/schemas/Problem'
              examples:
                default:
                  value:
                    type: about:blank
                    title: Invalid credentials
                    status: 401
                    code: AUTH_INVALID_CREDENTIALS
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        '403':
          $ref: './errors.yaml#/components/responses/Forbidden'
          description: The gateway returns this when the `Origin` check fails.
        '429':
          $ref: './errors.yaml#/components/responses/TooManyRequests'
  /api/auth/refresh:
    post:
      operationId: refreshSession
      summary: Rotate the access and refresh tokens
      description: >-
        Authenticates with the `refresh_token` cookie (security scheme `refreshCookieAuth`) and
        sets new `access_token` and `refresh_token` cookies through `Set-Cookie`; the hint cookie
        `logged_in=1` is renewed too. Tokens are returned only in `Set-Cookie`, never in the body;
        server-side callers such as `proxy.ts` read the `Set-Cookie` headers.

        Refresh tokens rotate with a grace period: the previous refresh token stays valid for a
        few seconds after a rotation, so parallel tabs and parallel server-side refreshes that
        present the same token all succeed. After the grace period the old token is rejected.

        Missing, expired and revoked tokens all return 401 `AUTH_REFRESH_INVALID`.
      tags: [auth]
      security:
        - refreshCookieAuth: []
      responses:
        '204':
          description: Session refreshed. The new tokens are in the `Set-Cookie` headers.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookies'
        '401':
          description: The refresh token is missing, expired or revoked.
          content:
            application/problem+json:
              schema:
                $ref: './errors.yaml#/components/schemas/Problem'
              examples:
                default:
                  value:
                    type: about:blank
                    title: Refresh token invalid
                    status: 401
                    code: AUTH_REFRESH_INVALID
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        '403':
          $ref: './errors.yaml#/components/responses/Forbidden'
          description: The gateway returns this when the `Origin` check fails.
        '429':
          $ref: './errors.yaml#/components/responses/TooManyRequests'
  /api/auth/logout:
    post:
      operationId: logout
      summary: Log out and clear the session cookies
      description: >-
        Ends the session. Succeeds without a valid access token, so an expired session can still
        be cleared. The response clears `access_token`, `refresh_token` and `logged_in` by setting
        each of them with `Max-Age=0`.
      tags: [auth]
      security: []
      responses:
        '204':
          description: Logged out. All three cookies are cleared.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ClearSessionCookies'
        '403':
          $ref: './errors.yaml#/components/responses/Forbidden'
          description: The gateway returns this when the `Origin` check fails.
        '429':
          $ref: './errors.yaml#/components/responses/TooManyRequests'
  /api/auth/me:
    get:
      operationId: getCurrentUser
      summary: Get the current user
      tags: [auth]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: The signed-in user.
          headers:
            Cache-Control:
              description: User data is never cached by shared caches.
              schema:
                type: string
              example: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
              examples:
                default:
                  value:
                    id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                    email: linh.nguyen@example.com
                    displayName: Linh Nguyen
                    memberTier: GOLD
        '401':
          $ref: './errors.yaml#/components/responses/Unauthorized'
        '429':
          $ref: './errors.yaml#/components/responses/TooManyRequests'
  /.well-known/jwks.json:
    get:
      operationId: getJwks
      summary: JSON Web Key Set for access-token verification
      description: >-
        Internal endpoint for the gateway, which verifies access tokens with these keys. The
        gateway does not route it from `/api`, so browsers cannot reach it. Public: it holds only
        public keys. During key rotation the set holds both the current and the previous key.
      tags: [auth]
      security: []
      x-internal: true
      responses:
        '200':
          description: The public signing keys.
          headers:
            Cache-Control:
              description: The gateway may cache the key set for a few minutes.
              schema:
                type: string
              example: public, max-age=300
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JwkSet'
              examples:
                default:
                  value:
                    keys:
                      - kty: RSA
                        kid: 2026-11-key-1
                        use: sig
                        alg: RS256
                        n: sXchDaQebHnPiGvyDOAT4saGEUetSyo9MKLOoWFsueri23bOdgWp4Dy1WlUzewbgBHod5pcM9H95GQRV3JDXboIRROSBigeC5yjU1hGzHHyXss8UDprecbAYxknTcQkhslANGRUZmdTOQ5qTRsLAt6BTYuyvVRdhS8exSZEy_c4gs_7svlJJQ4H9_NxsiIoLwAEk7-Q3UXERGYw_75IDrGA84-lA_-Ct4eTlXHBIY2EaV7t7LjJaynVJCpkv4LKjTTAumiGUIuQhrNhZLuF_RJLqHpM2kgWFLU7-VTdL1VbC2tejvcI2BlMkEpk1BzBZI0KQB0GaDWFLN-aEAw3vRw
                        e: AQAB
        '404':
          $ref: './errors.yaml#/components/responses/NotFound'
        '429':
          $ref: './errors.yaml#/components/responses/TooManyRequests'
  /api/products:
    get:
      operationId: listProducts
      summary: List products
      description: >-
        Public, cursor-paginated catalog, optionally filtered by category. Items are ordered by the
        server (newest first) and the order is stable across pages.
      tags: [products]
      security: []
      parameters:
        - name: category
          in: query
          required: false
          description: Category slug. Omit to list every category.
          schema:
            $ref: '#/components/schemas/CategorySlug'
        - $ref: './errors.yaml#/components/parameters/Cursor'
        - name: limit
          in: query
          required: false
          description: Maximum number of items to return.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: One page of products.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CatalogCacheControl'
            x-cache-tags:
              $ref: '#/components/headers/ListCacheTags'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
              examples:
                default:
                  value:
                    items:
                      - sku: SKU-ANC-PRO-BLK
                        slug: tai-nghe-anc-pro
                        name: Tai nghe ANC Pro
                        imageUrl: https://cdn.example.com/products/tai-nghe-anc-pro/1.jpg
                        price:
                          amount: 845500
                          currency: VND
                        listPrice:
                          amount: 1790000
                          currency: VND
                        badges: [DISCOUNT]
                    nextCursor: eyJpZCI6MTIzfQ
        '400':
          description: '`limit` or `category` is invalid, or the cursor cannot be read.'
          content:
            application/problem+json:
              schema:
                $ref: './errors.yaml#/components/schemas/Problem'
              examples:
                invalidLimit:
                  value:
                    type: about:blank
                    title: Validation failed
                    status: 400
                    code: VALIDATION_FAILED
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                    errors:
                      - field: limit
                        code: VALIDATION_FAILED
                        message: must be between 1 and 50
                invalidCursor:
                  value:
                    type: about:blank
                    title: Invalid cursor
                    status: 400
                    code: PAGINATION_CURSOR_INVALID
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        '429':
          $ref: './errors.yaml#/components/responses/TooManyRequests'
  /api/products/{slug}:
    get:
      operationId: getProduct
      summary: Get a product by slug
      description: >-
        Public product detail with its variants (colour and size options), as shown on the product
        page.
      tags: [products]
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            $ref: './errors.yaml#/components/schemas/Slug'
      responses:
        '200':
          description: The product.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CatalogCacheControl'
            x-cache-tags:
              $ref: '#/components/headers/ProductCacheTags'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'
              examples:
                default:
                  value:
                    id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                    sku: SKU-ANC-PRO-BLK
                    slug: tai-nghe-anc-pro
                    name: Tai nghe ANC Pro
                    brand: Mây Audio
                    imageUrl: https://cdn.example.com/products/tai-nghe-anc-pro/1.jpg
                    price:
                      amount: 845500
                      currency: VND
                    listPrice:
                      amount: 1790000
                      currency: VND
                    badges: [DISCOUNT]
                    description: Chống ồn chủ động đa tầng, thời lượng pin đến 40 giờ.
                    images:
                      - url: https://cdn.example.com/products/tai-nghe-anc-pro/1.jpg
                        alt: Tai nghe ANC Pro màu đen
                      - url: https://cdn.example.com/products/tai-nghe-anc-pro/2.jpg
                        alt: Tai nghe ANC Pro nhìn nghiêng
                    category:
                      slug: am-thanh
                      name: Âm thanh
                      path:
                        - slug: dien-tu
                          name: Điện tử
                        - slug: am-thanh
                          name: Âm thanh
                    variants:
                      - sku: SKU-ANC-PRO-BLK
                        options:
                          - name: color
                            value: Đen
                        price:
                          amount: 845500
                          currency: VND
                      - sku: SKU-ANC-PRO-WHT
                        options:
                          - name: color
                            value: Trắng
                        price:
                          amount: 845500
                          currency: VND
        '404':
          description: No product has this slug.
          content:
            application/problem+json:
              schema:
                $ref: './errors.yaml#/components/schemas/Problem'
              examples:
                default:
                  value:
                    type: about:blank
                    title: Product not found
                    status: 404
                    code: PRODUCT_NOT_FOUND
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        '429':
          $ref: './errors.yaml#/components/responses/TooManyRequests'
  /api/products/{sku}/availability:
    get:
      operationId: getProductAvailability
      summary: Get the current price and approximate stock of a SKU
      description: >-
        Public and cached for only a few seconds, so a burst of traffic at peak produces one
        backend call. Stock is approximate on purpose; the authoritative check happens when stock
        is reserved at checkout.
      tags: [products]
      security: []
      parameters:
        - name: sku
          in: path
          required: true
          schema:
            $ref: './errors.yaml#/components/schemas/Sku'
      responses:
        '200':
          description: Price and approximate stock level.
          headers:
            Cache-Control:
              description: Shared caches may keep the answer for a few seconds and serve it stale briefly.
              schema:
                type: string
              example: public, max-age=5, stale-while-revalidate=10
            x-cache-tags:
              $ref: '#/components/headers/ProductCacheTags'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Availability'
              examples:
                low:
                  value:
                    sku: SKU-ANC-PRO-BLK
                    price:
                      amount: 845500
                      currency: VND
                    stockLevel: LOW
                    approxQuantity: 40
        '404':
          description: No product has this SKU.
          content:
            application/problem+json:
              schema:
                $ref: './errors.yaml#/components/schemas/Problem'
              examples:
                default:
                  value:
                    type: about:blank
                    title: Product not found
                    status: 404
                    code: PRODUCT_NOT_FOUND
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        '429':
          $ref: './errors.yaml#/components/responses/TooManyRequests'
  /api/flash-sales/current:
    get:
      operationId: getCurrentFlashSale
      summary: Get the flash sale that is running now
      description: >-
        Public and cached for a few minutes, so the home page reads it from the shared cache. Each
        item is a product card plus the sale price and how much of the sale stock is gone.
      tags: [flash-sale]
      security: []
      responses:
        '200':
          description: The running flash sale.
          headers:
            Cache-Control:
              $ref: '#/components/headers/FlashSaleCacheControl'
            x-cache-tags:
              $ref: '#/components/headers/FlashSaleCacheTags'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlashSale'
              examples:
                default:
                  value:
                    id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                    startsAt: '2026-12-12T00:00:00Z'
                    endsAt: '2026-12-12T02:00:00Z'
                    items:
                      - sku: SKU-ANC-PRO-BLK
                        slug: tai-nghe-anc-pro
                        name: Tai nghe ANC Pro
                        imageUrl: https://cdn.example.com/products/tai-nghe-anc-pro/1.jpg
                        price:
                          amount: 845500
                          currency: VND
                        listPrice:
                          amount: 1790000
                          currency: VND
                        badges: [DISCOUNT]
                        salePrice:
                          amount: 645500
                          currency: VND
                        soldPercent: 62
        '404':
          description: No flash sale is running now.
          content:
            application/problem+json:
              schema:
                $ref: './errors.yaml#/components/schemas/Problem'
              examples:
                default:
                  value:
                    type: about:blank
                    title: No flash sale is running
                    status: 404
                    code: FLASH_SALE_NONE
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        '429':
          $ref: './errors.yaml#/components/responses/TooManyRequests'
  /api/products/{slug}/member-price:
    get:
      operationId: getMemberPrice
      summary: Get the signed-in member's price for a product
      description: >-
        User-specific, so it is never cached by shared caches. The product page streams it in after
        the cached shell. The price depends on the member's tier.
      tags: [products]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            $ref: './errors.yaml#/components/schemas/Slug'
      responses:
        '200':
          description: The member price.
          headers:
            Cache-Control:
              description: Member prices are private to the user and never stored.
              schema:
                type: string
              example: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberPrice'
              examples:
                default:
                  value:
                    sku: SKU-ANC-PRO-BLK
                    memberTier: GOLD
                    price:
                      amount: 804000
                      currency: VND
        '401':
          $ref: './errors.yaml#/components/responses/Unauthorized'
        '404':
          description: No product has this slug.
          content:
            application/problem+json:
              schema:
                $ref: './errors.yaml#/components/schemas/Problem'
              examples:
                default:
                  value:
                    type: about:blank
                    title: Product not found
                    status: 404
                    code: PRODUCT_NOT_FOUND
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        '429':
          $ref: './errors.yaml#/components/responses/TooManyRequests'
  /api/recommendations:
    get:
      operationId: listRecommendations
      summary: List recommended products
      description: >-
        Authentication is optional. The response shape is the same whether the results are
        personalised for the signed-in user or a static list of products related to `productSlug`,
        so clients do not depend on how they were chosen. The home and product pages stream it in
        after the cached shell.
      tags: [products]
      security:
        - {}
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: productSlug
          in: query
          required: false
          description: Product the recommendations relate to, for example on a product page.
          schema:
            $ref: './errors.yaml#/components/schemas/Slug'
        - name: limit
          in: query
          required: false
          description: Maximum number of items to return.
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 8
      responses:
        '200':
          description: Recommended products.
          headers:
            Cache-Control:
              description: May depend on the signed-in user, so shared caches must not store it.
              schema:
                type: string
              example: private
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recommendations'
              examples:
                default:
                  value:
                    items:
                      - sku: SKU-ANC-PRO-BLK
                        slug: tai-nghe-anc-pro
                        name: Tai nghe ANC Pro
                        imageUrl: https://cdn.example.com/products/tai-nghe-anc-pro/1.jpg
                        price:
                          amount: 845500
                          currency: VND
                        listPrice:
                          amount: 1790000
                          currency: VND
                        badges: [DISCOUNT]
        '400':
          description: '`limit` or `productSlug` is invalid.'
          content:
            application/problem+json:
              schema:
                $ref: './errors.yaml#/components/schemas/Problem'
              examples:
                default:
                  value:
                    type: about:blank
                    title: Validation failed
                    status: 400
                    code: VALIDATION_FAILED
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                    errors:
                      - field: limit
                        code: VALIDATION_FAILED
                        message: must be between 1 and 20
        '429':
          $ref: './errors.yaml#/components/responses/TooManyRequests'
  /api/checkout/reservations:
    post:
      operationId: createCheckoutReservation
      summary: Confirm price and stock and hold the items for 10 minutes
      description: >-
        Confirms the current price and stock of every line and reserves the stock for the signed-in
        user. The reservation expires 10 minutes after creation (`expiresAt`); the checkout page
        shows the countdown. The operation is all-or-nothing: when any line lacks stock the
        response is 409 `CHECKOUT_OUT_OF_STOCK` and nothing is reserved.

        Each line carries the confirmed `unitPrice`. `priceChanged` is true when that price differs
        from the current catalog-cached price the client last showed, so the page can tell the
        user before they pay.
      tags: [checkout]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReservationRequest'
            examples:
              default:
                value:
                  items:
                    - sku: SKU-ANC-PRO-BLK
                      quantity: 2
      responses:
        '201':
          description: Stock is reserved for 10 minutes.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CheckoutCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
              examples:
                default:
                  $ref: '#/components/examples/ReservationActive'
        '400':
          $ref: './errors.yaml#/components/responses/BadRequest'
        '401':
          $ref: './errors.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './errors.yaml#/components/responses/Forbidden'
          description: The gateway returns this when the `Origin` check fails.
        '409':
          description: Not enough stock for at least one line; nothing was reserved.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/OutOfStockProblem'
              examples:
                default:
                  value:
                    type: about:blank
                    title: Out of stock
                    status: 409
                    code: CHECKOUT_OUT_OF_STOCK
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                    unavailable:
                      - sku: SKU-ANC-PRO-BLK
                        requested: 2
                        available: 1
        '429':
          $ref: './errors.yaml#/components/responses/TooManyRequests'
  /api/checkout/reservations/{id}:
    get:
      operationId: getCheckoutReservation
      summary: Get a reservation and its current status
      description: >-
        Returns the reservation with its current `status`. A reservation of another user is
        reported as not found.
      tags: [checkout]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: './errors.yaml#/components/schemas/Uuid'
      responses:
        '200':
          description: The reservation.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CheckoutCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
              examples:
                default:
                  $ref: '#/components/examples/ReservationActive'
        '401':
          $ref: './errors.yaml#/components/responses/Unauthorized'
        '404':
          description: No reservation with this id exists for the caller.
          content:
            application/problem+json:
              schema:
                $ref: './errors.yaml#/components/schemas/Problem'
              examples:
                default:
                  value:
                    type: about:blank
                    title: Reservation not found
                    status: 404
                    code: CHECKOUT_RESERVATION_NOT_FOUND
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        '429':
          $ref: './errors.yaml#/components/responses/TooManyRequests'
  /api/checkout/shipping-options:
    get:
      operationId: listShippingOptions
      summary: List the shipping options
      description: >-
        Options shown on the checkout page. `reservationId` is optional; when given, the options
        and fees are those available for the reserved items.
      tags: [checkout]
      parameters:
        - name: reservationId
          in: query
          required: false
          schema:
            $ref: './errors.yaml#/components/schemas/Uuid'
      responses:
        '200':
          description: Shipping options.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CheckoutCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShippingOptions'
              examples:
                default:
                  value:
                    items:
                      - id: STANDARD
                        name: Giao tiêu chuẩn
                        fee:
                          amount: 0
                          currency: VND
                        estimatedDelivery: Nhận 13–14/12
                      - id: EXPRESS_2H
                        name: Giao nhanh 2h
                        fee:
                          amount: 35000
                          currency: VND
                        estimatedDelivery: Nhận trong hôm nay (nội thành)
        '400':
          $ref: './errors.yaml#/components/responses/BadRequest'
        '401':
          $ref: './errors.yaml#/components/responses/Unauthorized'
        '404':
          description: The `reservationId` does not exist for the caller.
          content:
            application/problem+json:
              schema:
                $ref: './errors.yaml#/components/schemas/Problem'
              examples:
                default:
                  value:
                    type: about:blank
                    title: Reservation not found
                    status: 404
                    code: CHECKOUT_RESERVATION_NOT_FOUND
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        '429':
          $ref: './errors.yaml#/components/responses/TooManyRequests'
  /api/checkout/payment-methods:
    get:
      operationId: listPaymentMethods
      summary: List the payment methods
      description: >-
        Methods shown on the checkout page. `available` is false when a method is temporarily
        unusable, for example when the payment gateway is down; the page shows it disabled.
        `EWALLET` and `CARD` are online methods served by the mock payment gateway.
      tags: [checkout]
      responses:
        '200':
          description: Payment methods.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CheckoutCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethods'
              examples:
                default:
                  value:
                    items:
                      - id: COD
                        name: Thanh toán khi nhận hàng (COD)
                        available: true
                      - id: EWALLET
                        name: Ví điện tử
                        available: true
                      - id: CARD
                        name: Thẻ ngân hàng / thẻ tín dụng
                        available: false
        '401':
          $ref: './errors.yaml#/components/responses/Unauthorized'
        '429':
          $ref: './errors.yaml#/components/responses/TooManyRequests'
  /api/orders:
    post:
      operationId: placeOrder
      summary: Place an order from an active reservation
      description: >-
        Creates an order from an `ACTIVE` checkout reservation, the chosen shipping option and
        payment method, and consumes the reservation. Requires the `Idempotency-Key` header.

        **Idempotency.** A replay with the same key and the same body returns the original status
        code and body, with the response header `Idempotent-Replayed: true`. The same key with a
        different body returns 422 `IDEMPOTENCY_KEY_REUSED`. A request that arrives while the first
        request with that key is still processing returns 409 `IDEMPOTENCY_IN_PROGRESS`. A missing
        or malformed key returns 400 `IDEMPOTENCY_KEY_MISSING`.

        **Payment.** With `COD` the order is `PLACED` and `payment.status` is `NOT_REQUIRED`. With
        `EWALLET` or `CARD` the order starts `PENDING_PAYMENT` with `payment.status` `PENDING`
        (and a `redirectUrl` when the provider needs one) and moves to `PAID` or `PAYMENT_FAILED`
        as the payment resolves; read it with `GET /api/orders/{id}`.
      tags: [orders]
      parameters:
        - $ref: './errors.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceOrderRequest'
            examples:
              cod:
                summary: Cash on delivery
                value:
                  reservationId: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                  shippingOptionId: STANDARD
                  paymentMethod: COD
                  shippingAddress:
                    fullName: Nguyen Van An
                    phone: '0901234567'
                    line1: 12 Nguyen Hue
                    ward: Ben Nghe
                    district: District 1
                    province: Ho Chi Minh City
                  note: Call before delivery
              ewallet:
                summary: E-wallet payment
                value:
                  reservationId: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                  shippingOptionId: EXPRESS_2H
                  paymentMethod: EWALLET
                  shippingAddress:
                    fullName: Nguyen Van An
                    phone: '0901234567'
                    line1: 12 Nguyen Hue
                    ward: Ben Nghe
                    district: District 1
                    province: Ho Chi Minh City
      responses:
        '201':
          description: 'The order was created (or, with `Idempotent-Replayed: true`, replayed).'
          headers:
            Cache-Control:
              $ref: '#/components/headers/CheckoutCacheControl'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              examples:
                cod:
                  summary: Cash on delivery
                  $ref: '#/components/examples/OrderPlacedCod'
                paymentFailed:
                  summary: Mock payment failed
                  $ref: '#/components/examples/OrderPaymentFailed'
        '400':
          description: >-
            The body is invalid (`VALIDATION_FAILED`) or the `Idempotency-Key` header is missing or
            not a UUID (`IDEMPOTENCY_KEY_MISSING`).
          content:
            application/problem+json:
              schema:
                $ref: './errors.yaml#/components/schemas/Problem'
              examples:
                validation:
                  value:
                    type: about:blank
                    title: Validation failed
                    status: 400
                    code: VALIDATION_FAILED
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                    errors:
                      - field: shippingAddress.phone
                        code: VALIDATION_FAILED
                        message: must be a valid phone number
                keyMissing:
                  value:
                    type: about:blank
                    title: Idempotency key missing
                    status: 400
                    code: IDEMPOTENCY_KEY_MISSING
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        '401':
          $ref: './errors.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './errors.yaml#/components/responses/Forbidden'
          description: The gateway returns this when the `Origin` check fails.
        '404':
          description: No reservation with this id exists for the caller.
          content:
            application/problem+json:
              schema:
                $ref: './errors.yaml#/components/schemas/Problem'
              examples:
                default:
                  value:
                    type: about:blank
                    title: Reservation not found
                    status: 404
                    code: CHECKOUT_RESERVATION_NOT_FOUND
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        '409':
          description: A request with the same `Idempotency-Key` is still being processed.
          content:
            application/problem+json:
              schema:
                $ref: './errors.yaml#/components/schemas/Problem'
              examples:
                default:
                  value:
                    type: about:blank
                    title: Request in progress
                    status: 409
                    code: IDEMPOTENCY_IN_PROGRESS
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        '410':
          description: The reservation expired or was released; reserve again.
          content:
            application/problem+json:
              schema:
                $ref: './errors.yaml#/components/schemas/Problem'
              examples:
                default:
                  value:
                    type: about:blank
                    title: Reservation expired
                    status: 410
                    code: CHECKOUT_RESERVATION_EXPIRED
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        '422':
          description: The `Idempotency-Key` was already used with a different request body.
          content:
            application/problem+json:
              schema:
                $ref: './errors.yaml#/components/schemas/Problem'
              examples:
                default:
                  value:
                    type: about:blank
                    title: Idempotency key reused
                    status: 422
                    code: IDEMPOTENCY_KEY_REUSED
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        '429':
          $ref: './errors.yaml#/components/responses/TooManyRequests'
  /api/orders/{id}:
    get:
      operationId: getOrder
      summary: Get an order
      description: >-
        Returns the order with its current `status` and `payment`. An order of another user is
        reported as not found.
      tags: [orders]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: './errors.yaml#/components/schemas/Uuid'
      responses:
        '200':
          description: The order.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CheckoutCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              examples:
                default:
                  $ref: '#/components/examples/OrderPlacedCod'
        '401':
          $ref: './errors.yaml#/components/responses/Unauthorized'
        '404':
          description: No order with this id exists for the caller.
          content:
            application/problem+json:
              schema:
                $ref: './errors.yaml#/components/schemas/Problem'
              examples:
                default:
                  value:
                    type: about:blank
                    title: Order not found
                    status: 404
                    code: ORDER_NOT_FOUND
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        '429':
          $ref: './errors.yaml#/components/responses/TooManyRequests'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: >-
        Used by the browser. The access token is an httpOnly cookie set by login and refresh; it is
        never returned in a response body.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Used between the gateway and the services. The gateway reads the `access_token` cookie
        (cookieAuth) and forwards it as `Authorization: Bearer`. Protected operations list
        cookieAuth and bearerAuth as two alternative security requirement objects.
    refreshCookieAuth:
      type: apiKey
      in: cookie
      name: refresh_token
      description: >-
        The httpOnly `refresh_token` cookie set by login and refresh. It is accepted only by
        `POST /api/auth/refresh`.
  headers:
    CatalogCacheControl:
      description: >-
        Shared caches may keep the response for a few minutes and serve it stale while they
        revalidate.
      schema:
        type: string
      example: public, max-age=120, stale-while-revalidate=600
    ListCacheTags:
      description: Space-separated cache tags the frontend revalidates by. The list carries `products`.
      schema:
        type: string
      example: products
    ProductCacheTags:
      description: >-
        Space-separated cache tags the frontend revalidates by. Detail and availability carry
        `product-{id}`, where `{id}` is the product's `id`.
      schema:
        type: string
      example: product-3fa85f64-5717-4562-b3fc-2c963f66afa6
    FlashSaleCacheControl:
      description: >-
        Shared caches may keep the flash sale for a few minutes; it is revalidated by tag when the
        sale changes.
      schema:
        type: string
      example: public, max-age=60, stale-while-revalidate=120
    FlashSaleCacheTags:
      description: Space-separated cache tags the frontend revalidates by. The flash sale carries `flash-sale`.
      schema:
        type: string
      example: flash-sale
      x-cache-tags: [flash-sale]
    CheckoutCacheControl:
      description: Checkout data belongs to one user and changes quickly; no cache may store it.
      schema:
        type: string
      example: private, no-store
    IdempotentReplayed:
      description: Present and `true` when the response replays the original result for the same `Idempotency-Key`.
      schema:
        type: boolean
      example: true
    SetSessionCookies:
      description: >-
        Three `Set-Cookie` headers: `access_token` and `refresh_token` (both httpOnly, Secure,
        SameSite=Lax, Path=/) and the hint cookie `logged_in=1` (not httpOnly, Secure,
        SameSite=Lax, Path=/).
      schema:
        type: array
        items:
          type: string
      example:
        - access_token=eyJhbGciOi...; Max-Age=600; Path=/; HttpOnly; Secure; SameSite=Lax
        - refresh_token=3f6c9d1e...; Max-Age=1209600; Path=/; HttpOnly; Secure; SameSite=Lax
        - logged_in=1; Max-Age=1209600; Path=/; Secure; SameSite=Lax
    ClearSessionCookies:
      description: Three `Set-Cookie` headers that clear `access_token`, `refresh_token` and `logged_in`.
      schema:
        type: array
        items:
          type: string
      example:
        - access_token=; Max-Age=0; Path=/; HttpOnly; Secure; SameSite=Lax
        - refresh_token=; Max-Age=0; Path=/; HttpOnly; Secure; SameSite=Lax
        - logged_in=; Max-Age=0; Path=/; Secure; SameSite=Lax
  examples:
    ReservationActive:
      value:
        id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        status: ACTIVE
        expiresAt: '2026-12-12T03:10:00Z'
        items:
          - sku: SKU-ANC-PRO-BLK
            quantity: 2
            unitPrice:
              amount: 845500
              currency: VND
            lineTotal:
              amount: 1691000
              currency: VND
            priceChanged: false
        subtotal:
          amount: 1691000
          currency: VND
    OrderPlacedCod:
      value:
        id: 0a5f8d4e-6c1b-4f0a-9d3e-2b7c1e8f4a90
        status: PLACED
        items:
          - sku: SKU-ANC-PRO-BLK
            quantity: 2
            unitPrice:
              amount: 845500
              currency: VND
            lineTotal:
              amount: 1691000
              currency: VND
        subtotal:
          amount: 1691000
          currency: VND
        shippingFee:
          amount: 30000
          currency: VND
        total:
          amount: 1721000
          currency: VND
        payment:
          method: COD
          status: NOT_REQUIRED
        createdAt: '2026-12-12T03:04:00Z'
    OrderPaymentFailed:
      value:
        id: 5d1c7a22-93b4-4e6f-8a0b-c4e2f9d17b36
        status: PAYMENT_FAILED
        items:
          - sku: SKU-ANC-PRO-BLK
            quantity: 2
            unitPrice:
              amount: 845500
              currency: VND
            lineTotal:
              amount: 1691000
              currency: VND
        subtotal:
          amount: 1691000
          currency: VND
        shippingFee:
          amount: 30000
          currency: VND
        total:
          amount: 1721000
          currency: VND
        payment:
          method: EWALLET
          status: FAILED
        createdAt: '2026-12-12T03:04:00Z'
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
    UserProfile:
      type: object
      required: [id, email, displayName, memberTier]
      properties:
        id:
          $ref: './errors.yaml#/components/schemas/Uuid'
        email:
          type: string
          format: email
        displayName:
          type: string
        memberTier:
          type: string
          description: Loyalty tier of the member.
          enum: [STANDARD, SILVER, GOLD, PLATINUM]
    JwkSet:
      type: object
      description: JSON Web Key Set (RFC 7517) holding RSA public keys.
      required: [keys]
      properties:
        keys:
          type: array
          items:
            $ref: '#/components/schemas/Jwk'
    Jwk:
      type: object
      required: [kty, kid, use, alg, n, e]
      properties:
        kty:
          type: string
          const: RSA
        kid:
          type: string
          description: Key id; matches the `kid` header of the access token.
        use:
          type: string
          const: sig
        alg:
          type: string
          const: RS256
        n:
          type: string
          description: Base64url-encoded modulus.
        e:
          type: string
          description: Base64url-encoded public exponent.
    CategorySlug:
      type: string
      description: URL-friendly category identifier.
      examples: [am-thanh]
    CategoryRef:
      type: object
      required: [slug, name]
      properties:
        slug:
          $ref: '#/components/schemas/CategorySlug'
        name:
          type: string
    Category:
      description: A category with its path from the root, for the breadcrumb.
      allOf:
        - $ref: '#/components/schemas/CategoryRef'
        - type: object
          required: [path]
          properties:
            path:
              type: array
              description: Ancestors from the root down to and including this category.
              items:
                $ref: '#/components/schemas/CategoryRef'
    ProductSummary:
      type: object
      description: The product card shown in lists. Other specs reuse this component.
      required: [sku, slug, name, imageUrl, price]
      properties:
        sku:
          $ref: './errors.yaml#/components/schemas/Sku'
        slug:
          $ref: './errors.yaml#/components/schemas/Slug'
        name:
          type: string
        imageUrl:
          type: string
          format: uri
        price:
          $ref: './errors.yaml#/components/schemas/Money'
        listPrice:
          description: Price before the discount; present only when it is higher than `price`.
          $ref: './errors.yaml#/components/schemas/Money'
        badges:
          type: array
          description: >-
            Labels such as `DISCOUNT`. Clients ignore values they do not know, so new badges are
            not breaking.
          items:
            type: string
            pattern: '^[A-Z][A-Z0-9_]*$'
    FlashSaleItem:
      description: A product card in the flash sale, with its sale price and progress.
      allOf:
        - $ref: '#/components/schemas/ProductSummary'
        - type: object
          required: [salePrice, soldPercent]
          properties:
            salePrice:
              $ref: './errors.yaml#/components/schemas/Money'
            soldPercent:
              type: integer
              description: Share of the sale stock already sold, in percent.
              minimum: 0
              maximum: 100
    FlashSale:
      type: object
      required: [id, startsAt, endsAt, items]
      properties:
        id:
          $ref: './errors.yaml#/components/schemas/Uuid'
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
          description: The countdown on the home page runs to this instant.
        items:
          type: array
          items:
            $ref: '#/components/schemas/FlashSaleItem'
    MemberPrice:
      type: object
      required: [sku, memberTier, price]
      properties:
        sku:
          $ref: './errors.yaml#/components/schemas/Sku'
        memberTier:
          type: string
          description: Loyalty tier the price was computed for.
          enum: [STANDARD, SILVER, GOLD, PLATINUM]
        price:
          $ref: './errors.yaml#/components/schemas/Money'
    Recommendations:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProductSummary'
    ProductPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProductSummary'
        nextCursor:
          type: [string, 'null']
          description: Cursor for the next page, or null on the last page.
    ProductImage:
      type: object
      required: [url, alt]
      properties:
        url:
          type: string
          format: uri
        alt:
          type: string
    ProductOption:
      type: object
      required: [name, value]
      properties:
        name:
          type: string
          description: Option name such as `color` or `size`.
        value:
          type: string
          description: Display value in Vietnamese, for example `Đen`.
    ProductVariant:
      type: object
      required: [sku, options, price]
      properties:
        sku:
          $ref: './errors.yaml#/components/schemas/Sku'
        options:
          type: array
          items:
            $ref: '#/components/schemas/ProductOption'
        price:
          $ref: './errors.yaml#/components/schemas/Money'
    ProductDetail:
      description: A product with everything the product page shows.
      allOf:
        - $ref: '#/components/schemas/ProductSummary'
        - type: object
          required: [id, brand, description, images, category, variants]
          properties:
            id:
              description: Product id used in cache tags (`product-{id}`).
              $ref: './errors.yaml#/components/schemas/Uuid'
            brand:
              type: string
            description:
              type: string
            images:
              type: array
              items:
                $ref: '#/components/schemas/ProductImage'
            category:
              $ref: '#/components/schemas/Category'
            variants:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/ProductVariant'
    StockLevel:
      type: string
      enum: [IN_STOCK, LOW, OUT_OF_STOCK]
    Availability:
      type: object
      required: [sku, price, stockLevel]
      properties:
        sku:
          $ref: './errors.yaml#/components/schemas/Sku'
        price:
          $ref: './errors.yaml#/components/schemas/Money'
        stockLevel:
          $ref: '#/components/schemas/StockLevel'
        approxQuantity:
          type: integer
          minimum: 0
          description: Approximate units left; shown only when stock is low.
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [UP, DOWN, OUT_OF_SERVICE, UNKNOWN]
    CreateReservationRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            required: [sku, quantity]
            properties:
              sku:
                $ref: './errors.yaml#/components/schemas/Sku'
              quantity:
                type: integer
                minimum: 1
                maximum: 99
    ReservationStatus:
      type: string
      description: >-
        `ACTIVE` while the hold is valid, `EXPIRED` after `expiresAt`, `CONSUMED` once an order was
        placed from it, `RELEASED` when it was given back before expiry.
      enum: [ACTIVE, EXPIRED, CONSUMED, RELEASED]
    ReservationItem:
      type: object
      required: [sku, quantity, unitPrice, lineTotal, priceChanged]
      properties:
        sku:
          $ref: './errors.yaml#/components/schemas/Sku'
        quantity:
          type: integer
          minimum: 1
        unitPrice:
          allOf:
            - $ref: './errors.yaml#/components/schemas/Money'
          description: Price confirmed when the stock was reserved.
        lineTotal:
          allOf:
            - $ref: './errors.yaml#/components/schemas/Money'
          description: '`unitPrice` times `quantity`.'
        priceChanged:
          type: boolean
          description: >-
            True when the confirmed price differs from the current catalog-cached price.
    Reservation:
      type: object
      required: [id, status, expiresAt, items, subtotal]
      properties:
        id:
          $ref: './errors.yaml#/components/schemas/Uuid'
        status:
          $ref: '#/components/schemas/ReservationStatus'
        expiresAt:
          type: string
          format: date-time
          description: Exactly 10 minutes after the reservation was created.
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReservationItem'
        subtotal:
          allOf:
            - $ref: './errors.yaml#/components/schemas/Money'
          description: Sum of the line totals, before shipping.
    OutOfStockProblem:
      description: '`CHECKOUT_OUT_OF_STOCK` problem with the affected SKUs in `unavailable`.'
      allOf:
        - $ref: './errors.yaml#/components/schemas/Problem'
        - type: object
          required: [unavailable]
          properties:
            unavailable:
              type: array
              items:
                type: object
                required: [sku, requested, available]
                properties:
                  sku:
                    $ref: './errors.yaml#/components/schemas/Sku'
                  requested:
                    type: integer
                    minimum: 1
                  available:
                    type: integer
                    minimum: 0
    ShippingOption:
      type: object
      required: [id, name, fee, estimatedDelivery]
      properties:
        id:
          type: string
          enum: [STANDARD, EXPRESS_2H]
        name:
          type: string
        fee:
          $ref: './errors.yaml#/components/schemas/Money'
        estimatedDelivery:
          type: string
          description: Delivery estimate, ready to display.
    ShippingOptions:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ShippingOption'
    PaymentMethod:
      type: object
      required: [id, name, available]
      properties:
        id:
          type: string
          enum: [COD, EWALLET, CARD]
        name:
          type: string
        available:
          type: boolean
    PaymentMethods:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PaymentMethod'
    ShippingAddress:
      type: object
      required: [fullName, phone, line1, ward, district, province]
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 100
        phone:
          type: string
          minLength: 1
          maxLength: 20
        line1:
          type: string
          minLength: 1
          maxLength: 200
        ward:
          type: string
          minLength: 1
          maxLength: 100
        district:
          type: string
          minLength: 1
          maxLength: 100
        province:
          type: string
          minLength: 1
          maxLength: 100
    PlaceOrderRequest:
      type: object
      required: [reservationId, shippingOptionId, paymentMethod, shippingAddress]
      properties:
        reservationId:
          $ref: './errors.yaml#/components/schemas/Uuid'
        shippingOptionId:
          type: string
          enum: [STANDARD, EXPRESS_2H]
        paymentMethod:
          type: string
          enum: [COD, EWALLET, CARD]
        shippingAddress:
          $ref: '#/components/schemas/ShippingAddress'
        note:
          type: string
          maxLength: 500
    OrderStatus:
      type: string
      description: >-
        `PENDING_PAYMENT` while an online payment is unresolved, `PLACED` for an accepted order
        that needs no payment now (COD), `PAID` after a successful payment, `PAYMENT_FAILED` when
        the payment failed or timed out, `CANCELLED` once cancelled.
      enum: [PENDING_PAYMENT, PLACED, PAID, PAYMENT_FAILED, CANCELLED]
    OrderItem:
      type: object
      required: [sku, quantity, unitPrice, lineTotal]
      properties:
        sku:
          $ref: './errors.yaml#/components/schemas/Sku'
        quantity:
          type: integer
          minimum: 1
        unitPrice:
          $ref: './errors.yaml#/components/schemas/Money'
        lineTotal:
          $ref: './errors.yaml#/components/schemas/Money'
    OrderPayment:
      type: object
      required: [method, status]
      properties:
        method:
          type: string
          enum: [COD, EWALLET, CARD]
        status:
          type: string
          enum: [PENDING, SUCCEEDED, FAILED, TIMED_OUT, NOT_REQUIRED]
        redirectUrl:
          type: string
          format: uri
          description: Where to send the user to complete an online payment, when the provider needs it.
    Order:
      type: object
      required: [id, status, items, subtotal, shippingFee, total, payment, createdAt]
      properties:
        id:
          $ref: './errors.yaml#/components/schemas/Uuid'
        status:
          $ref: '#/components/schemas/OrderStatus'
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        subtotal:
          $ref: './errors.yaml#/components/schemas/Money'
        shippingFee:
          $ref: './errors.yaml#/components/schemas/Money'
        total:
          allOf:
            - $ref: './errors.yaml#/components/schemas/Money'
          description: '`subtotal` plus `shippingFee`.'
        payment:
          $ref: '#/components/schemas/OrderPayment'
        createdAt:
          type: string
          format: date-time
