openapi: 3.1.1
info:
  title: Shop shared error schema
  version: 1.4.0
  description: >-
    Shared error schemas referenced by core.yaml and cart.yaml. Errors follow
    RFC 9457 (problem details) with a stable machine-readable `code`.
  license:
    name: UNLICENSED
    identifier: UNLICENSED
servers:
  - url: http://localhost:8080
paths: {}
x-error-codes:
  # Catalogue of stable error codes. Add a code here in the task that introduces it; convention
  # check (contracts/scripts/check-conventions.mjs) rejects problem examples with unknown codes.
  VALIDATION_FAILED:
    status: 400
    description: >-
      The request is malformed or a field is invalid; see errors[].
  AUTH_UNAUTHENTICATED:
    status: 401
    description: >-
      No valid access token was presented: the Bearer token is invalid or expired, or (on cart
      operations) there is no Bearer token but the `logged_in=1` hint cookie is present.
  AUTH_INVALID_CREDENTIALS:
    status: 401
    description: >-
      The email or password is wrong.
  AUTH_REFRESH_INVALID:
    status: 401
    description: >-
      The refresh token is missing, expired or revoked; the user must log in again.
  AUTH_FORBIDDEN:
    status: 403
    description: >-
      The caller is authenticated but not allowed to do this.
  NOT_FOUND:
    status: 404
    description: >-
      The resource does not exist or is not visible to the caller.
  PRODUCT_NOT_FOUND:
    status: 404
    description: >-
      No product exists for the given slug or SKU.
  FLASH_SALE_NONE:
    status: 404
    description: >-
      No flash sale is running now.
  PRODUCT_UPDATE_INVALID:
    status: 422
    description: >-
      The internal product update is well formed but not acceptable, for example a list price
      below the price.
  REVALIDATE_SIGNATURE_INVALID:
    status: 401
    description: >-
      The `X-Shop-Signature` of a revalidation webhook is missing, malformed, wrong or too old.
  CHECKOUT_OUT_OF_STOCK:
    status: 409
    description: >-
      At least one line lacks stock; nothing was reserved. The `unavailable` extension field lists
      each SKU with the requested and available quantity.
  CHECKOUT_RESERVATION_NOT_FOUND:
    status: 404
    description: >-
      No reservation with this id exists for the caller (another user's reservation is not found
      either).
  CHECKOUT_RESERVATION_EXPIRED:
    status: 410
    description: >-
      The reservation passed its 10-minute expiry (or was released); reserve again.
  CHECKOUT_RESERVATION_CONSUMED:
    status: 410
    description: >-
      An order was already placed from this reservation.
  CHECKOUT_PAYMENT_METHOD_UNAVAILABLE:
    status: 422
    description: >-
      The chosen payment method is currently unavailable; choose another one.
  PAGINATION_CURSOR_INVALID:
    status: 400
    description: >-
      The `cursor` query parameter is not a cursor this API issued, or it has expired; restart from
      the first page.
  CART_ITEM_NOT_FOUND:
    status: 404
    description: >-
      The SKU is not in the cart (PATCH or DELETE of a missing item).
  CART_OUT_OF_STOCK:
    status: 409
    description: >-
      The SKU does not have enough stock for the requested quantity.
  CART_QTY_LIMIT:
    status: 422
    description: >-
      The quantity would exceed the per-SKU limit. The limit is in the problem `detail` and in the
      `limit` extension field.
  CART_ITEMS_LIMIT:
    status: 422
    description: >-
      Adding a new SKU would put more than 50 distinct SKUs in the cart. The limit is in the
      problem `detail` and in the `limit` extension field.
  CONFLICT:
    status: 409
    description: >-
      The request conflicts with the current state of the resource.
  IDEMPOTENCY_KEY_MISSING:
    status: 400
    description: >-
      Idempotency-Key header is required on this operation.
  IDEMPOTENCY_KEY_REUSED:
    status: 422
    description: >-
      The Idempotency-Key was already used with a different request body.
  IDEMPOTENCY_IN_PROGRESS:
    status: 409
    description: >-
      A request with the same Idempotency-Key is still being processed; retry shortly with the same
      key.
  ORDER_NOT_FOUND:
    status: 404
    description: >-
      No order with this id exists for the caller (another user's order is not found either).
  UNPROCESSABLE_ENTITY:
    status: 422
    description: >-
      The request is well formed but violates a business rule.
  RATE_LIMITED:
    status: 429
    description: >-
      Too many requests; retry after the Retry-After header.
  INTERNAL_ERROR:
    status: 500
    description: >-
      Unexpected server error.
  SERVICE_UNAVAILABLE:
    status: 503
    description: >-
      The service or a dependency is temporarily unavailable.
components:
  parameters:
    Limit:
      name: limit
      in: query
      description: Maximum number of items to return.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous page's `nextCursor`. Omit for the first page.
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Client-generated UUID that makes POST /api/orders safe to retry. A replay with the same key
        and body returns the original response; a different body returns 422 IDEMPOTENCY_KEY_REUSED.
      schema:
        type: string
        format: uuid
  schemas:
    Money:
      type: object
      description: Amount in VND (integer, no minor unit).
      required: [amount, currency]
      properties:
        amount:
          type: integer
          minimum: 0
          examples: [890000]
        currency:
          type: string
          const: VND
    Sku:
      type: string
      description: Product stock-keeping unit.
      examples: [SKU-001]
    Slug:
      type: string
      description: URL-friendly product identifier.
      examples: [ao-thun-basic]
    Uuid:
      type: string
      format: uuid
      examples: [3fa85f64-5717-4562-b3fc-2c963f66afa6]
    CursorPage:
      type: object
      description: >-
        Pattern for cursor-paginated lists. Later tasks define a concrete page schema with the same
        shape, where `items` has a concrete item type. Query with the Limit and Cursor parameters.
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: {}
        nextCursor:
          type: [string, 'null']
          description: Cursor for the next page, or null on the last page.
    Problem:
      type: object
      description: RFC 9457 problem details with a stable error code.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
          description: URI reference that identifies the problem type.
        title:
          type: string
          description: Short, human-readable summary of the problem type.
        status:
          type: integer
          format: int32
          minimum: 100
          maximum: 599
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]*$'
          description: Stable machine-readable error code, for example CART_QTY_LIMIT.
          examples: [CART_QTY_LIMIT]
        traceId:
          type: string
          description: Correlation id for logs and traces.
        limit:
          type: integer
          format: int32
          minimum: 1
          description: Limit that was exceeded, returned with CART_QTY_LIMIT (10) and CART_ITEMS_LIMIT (50).
        errors:
          type: array
          description: Field-level validation errors, if any.
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      required: [field, code]
      properties:
        field:
          type: string
          description: JSON pointer or dotted path of the invalid field.
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]*$'
        message:
          type: string
  responses:
    BadRequest:
      description: The request is malformed or fails validation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            default:
              value:
                type: about:blank
                title: Validation failed
                status: 400
                code: VALIDATION_FAILED
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                errors:
                  - field: quantity
                    code: VALIDATION_FAILED
                    message: must be at least 1
    Unauthorized:
      description: Authentication is missing or invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            default:
              value:
                type: about:blank
                title: Unauthenticated
                status: 401
                code: AUTH_UNAUTHENTICATED
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    Forbidden:
      description: The caller is not allowed to do this.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            default:
              value:
                type: about:blank
                title: Forbidden
                status: 403
                code: AUTH_FORBIDDEN
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    NotFound:
      description: The resource does not exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            default:
              value:
                type: about:blank
                title: Not found
                status: 404
                code: NOT_FOUND
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    Conflict:
      description: The request conflicts with the current state.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            default:
              value:
                type: about:blank
                title: Conflict
                status: 409
                code: CONFLICT
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    UnprocessableEntity:
      description: The request violates a business rule.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            default:
              value:
                type: about:blank
                title: Unprocessable entity
                status: 422
                code: UNPROCESSABLE_ENTITY
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    TooManyRequests:
      description: Rate limit exceeded.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
            minimum: 0
          example: 5
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            default:
              value:
                type: about:blank
                title: Too many requests
                status: 429
                code: RATE_LIMITED
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    ServiceUnavailable:
      description: The service or a dependency is unavailable.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            default:
              value:
                type: about:blank
                title: Service unavailable
                status: 503
                code: SERVICE_UNAVAILABLE
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    InternalError:
      description: Unexpected server error.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            default:
              value:
                type: about:blank
                title: Internal error
                status: 500
                code: INTERNAL_ERROR
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
